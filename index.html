<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12203A">
<title>Harvest — preaching tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12203A; --ink-2:#4B5B74; --ink-3:#7C8AA0;
  --paper:#FFFFFF; --mist:#F1F4F9; --line:#DCE3EC; --line-2:#EDF1F6;
  --preach:#4A6FA5; --valid:#0E8A7D; --fruit:#C4790F; --retained:#B22E4C;
  --preach-bg:#EBF1F9; --valid-bg:#E3F5F2; --fruit-bg:#FBF0DE; --retained-bg:#FAE8EC;
  --r:14px; --r-sm:10px;
  --shell:520px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Inter,system-ui,sans-serif;
  color:var(--ink); background:var(--mist);
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3,.num{font-family:Archivo,system-ui,sans-serif;letter-spacing:-.02em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--preach);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.shell{max-width:var(--shell);margin:0 auto;min-height:100%;background:var(--paper);
  display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line)}
.screen{flex:1;padding:20px 18px 104px;display:none}
.screen.on{display:block}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--paper);
  border-bottom:1px solid var(--line-2);padding:14px 18px;
  display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.top h1{font-size:19px;font-weight:700}
.top .who{font-size:13px;color:var(--ink-3);font-weight:500}
.top .who b{color:var(--ink-2);font-weight:600}

/* ---------- stage rail: the hero ---------- */
.rail{display:flex;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);margin-bottom:6px}
.rail div{flex:1;padding:13px 10px;text-align:center;border-right:1px solid var(--line)}
.rail div:last-child{border-right:0}
.rail .n{font-family:Archivo;font-size:26px;font-weight:700;line-height:1.05;display:block}
.rail .l{font-size:10.5px;font-weight:600;margin-top:4px;display:block;color:var(--ink-2)}
.s-preach{background:var(--preach-bg)} .s-preach .n{color:var(--preach)}
.s-valid{background:var(--valid-bg)}  .s-valid .n{color:var(--valid)}
.s-fruit{background:var(--fruit-bg)}  .s-fruit .n{color:var(--fruit)}
.s-ret{background:var(--retained-bg)} .s-ret .n{color:var(--retained)}
.rail-cap{font-size:11.5px;color:var(--ink-3);text-align:center;margin-bottom:20px}

/* ---------- points ---------- */
.pts{display:flex;align-items:flex-end;justify-content:space-between;
  padding:16px 0 12px;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2);margin-bottom:20px}
.pts .big{font-family:Archivo;font-size:38px;font-weight:700;line-height:1}
.pts .lab{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.pts .pct{text-align:right;font-size:13px;color:var(--ink-2);font-weight:600}

/* ---------- goal bars ---------- */
.goal{margin-bottom:15px}
.goal .r1{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.goal .nm{font-size:14px;font-weight:600}
.goal .ct{font-size:13px;color:var(--ink-2);font-weight:600}
.goal .ct b{font-family:Archivo;font-weight:700;font-size:15px;color:var(--ink)}
.bar{height:9px;border-radius:99px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.done .nm::after{content:" ✓";color:var(--valid);font-weight:700}

/* ---------- quick log ---------- */
.qtitle{font-size:12.5px;font-weight:600;color:var(--ink-3);margin:26px 0 10px}
.q-preach{width:100%;display:flex;align-items:center;justify-content:space-between;
  background:var(--preach);color:#fff;border-radius:var(--r);padding:17px 20px;margin-bottom:10px}
.q-preach span{font-size:16px;font-weight:600}
.q-preach b{font-family:Archivo;font-size:24px;font-weight:700}
.q-preach:active{transform:scale(.985)}
.q-row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.q-row button{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:13px 6px;
  font-size:13px;font-weight:600;background:var(--paper)}
.q-row button:active{background:var(--mist)}
.q-row .b-valid{border-color:#A9DCD5;color:var(--valid)}
.q-row .b-fruit{border-color:#EBCE9C;color:var(--fruit)}
.q-row .b-ret{border-color:#EEBBC6;color:var(--retained)}
.q-tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:9px}
.q-tools button{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:12px 3px;
  font-size:11.5px;font-weight:600;background:var(--paper);line-height:1.25}
.q-tools button:active{background:var(--mist)}
.q-tools b{display:block;font-family:Archivo;font-size:14px;font-weight:700;color:var(--ink-3);margin-top:3px}
.q-sub{font-size:11.5px;font-weight:600;color:var(--ink-3);margin:16px 0 8px}
.bk{margin-bottom:13px}
.bk .r1{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.bk .nm{font-size:13.5px;font-weight:600}
.bk .ct{font-size:12.5px;color:var(--ink-2);font-weight:600}
.bk .ct b{font-family:Archivo;font-size:14px;color:var(--ink)}
.capped{color:var(--fruit)}
.backdate{width:100%;text-align:center;font-size:12.5px;color:var(--ink-3);padding:14px 0 0;font-weight:500}

/* ---------- lists / cards ---------- */
.card{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;background:var(--paper)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .nm{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.row .val{font-family:Archivo;font-size:17px;font-weight:700;text-align:right}
.row .val small{display:block;font-family:Inter;font-size:11px;font-weight:500;color:var(--ink-3)}
.rank{width:22px;font-family:Archivo;font-size:13px;font-weight:700;color:var(--ink-3);text-align:right}

.ghead{display:flex;align-items:center;justify-content:space-between;
  margin:22px 0 4px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.ghead h2{font-size:15px;font-weight:700}
.ghead .tot{font-family:Archivo;font-size:15px;font-weight:700}
.ghead .tot small{font-family:Inter;font-size:11px;font-weight:500;color:var(--ink-3);margin-left:4px}

.pill{display:inline-block;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:99px}
.p-valid{background:var(--valid-bg);color:var(--valid)}
.p-fruit{background:var(--fruit-bg);color:var(--fruit)}
.p-ret{background:var(--retained-bg);color:var(--retained)}
.p-quiet{background:var(--line-2);color:var(--ink-3)}
.p-preach{background:var(--preach-bg);color:var(--preach)}

.mini{height:6px;border-radius:99px;background:var(--line-2);margin-top:7px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--ink);border-radius:99px}

.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;margin-bottom:6px}
.seg button{flex:1;padding:9px 4px;font-size:12.5px;font-weight:600;color:var(--ink-3);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}

.empty{text-align:center;padding:44px 20px;color:var(--ink-3)}
.empty b{display:block;font-family:Archivo;font-size:16px;color:var(--ink-2);margin-bottom:6px;font-weight:600}
.empty span{font-size:13.5px;line-height:1.5}

/* ---------- tabs ---------- */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--paper);
  border-top:1px solid var(--line);display:flex;max-width:var(--shell);margin:0 auto;
  padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:9px 2px 11px;font-size:10.5px;font-weight:600;color:var(--ink-3);
  display:flex;flex-direction:column;align-items:center;gap:4px}
.tabs button.on{color:var(--ink)}
.tabs svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.9;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.tabs button.on svg{stroke-width:2.3}

/* ---------- login ---------- */
.login{padding:38px 22px 40px}
.login h1{font-size:30px;font-weight:700;line-height:1.1}
.login .sub{font-size:14px;color:var(--ink-3);margin:10px 0 30px;line-height:1.5}
.who-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.who-grid button{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:15px 12px;text-align:left;background:var(--paper)}
.who-grid button:active{border-color:var(--ink)}
.who-grid .n{font-size:14.5px;font-weight:600;display:block}
.who-grid .g{font-size:11px;color:var(--ink-3);margin-top:3px;display:block}
.pinbox{text-align:center}
.pindots{display:flex;gap:13px;justify-content:center;margin:24px 0 28px}
.pindots i{width:13px;height:13px;border-radius:99px;border:2px solid var(--line);transition:all .15s}
.pindots i.f{background:var(--ink);border-color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;max-width:280px;margin:0 auto}
.pad button{aspect-ratio:1.5;border-radius:var(--r-sm);background:var(--mist);
  font-family:Archivo;font-size:23px;font-weight:600}
.pad button:active{background:var(--line)}
.pad .alt{font-family:Inter;font-size:13px;font-weight:600;background:none;color:var(--ink-3)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(12,20,34,.5);z-index:40;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--paper);
  border-radius:22px 22px 0 0;padding:8px 20px calc(24px + env(safe-area-inset-bottom));
  max-width:var(--shell);margin:0 auto;max-height:88vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 16px}
.sheet h2{font-size:18px;font-weight:700;margin-bottom:5px}
.sheet .hint{font-size:13px;color:var(--ink-3);line-height:1.5;margin-bottom:18px}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin:14px 0 6px}
.inp{width:100%;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:12px 13px;font-size:15px;background:var(--paper)}
.inp:focus{border-color:var(--preach);outline:none}
.btn{width:100%;background:var(--ink);color:#fff;border-radius:var(--r-sm);padding:15px;
  font-size:15px;font-weight:600;margin-top:20px}
.btn:disabled{opacity:.45}
.btn.ghost{background:none;color:var(--ink-3);border:1.5px solid var(--line);margin-top:9px}
.btn.danger{background:var(--retained)}
.pick{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:12px 13px;margin-bottom:8px;
  display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.pick.sel{border-color:var(--ink);background:var(--mist)}
.pick .nm{flex:1;font-size:14.5px;font-weight:600}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,14px);z-index:60;
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:99px;font-size:13.5px;font-weight:500;
  opacity:0;pointer-events:none;transition:all .22s;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--retained)}
.offline{background:var(--fruit-bg);color:#8A5409;font-size:12.5px;font-weight:600;
  padding:9px 18px;text-align:center;display:none}
.offline.on{display:block}
.setup{padding:50px 24px;font-size:14px;line-height:1.65;color:var(--ink-2)}
.setup code{background:var(--mist);padding:2px 6px;border-radius:5px;font-size:13px}
</style>
</head>
<body>

<div class="shell">
  <div class="offline" id="offline">Saved locally. Will sync when you're back online.</div>

  <!-- LOGIN -->
  <div id="login" class="login">
    <h1>Harvest</h1>
    <p class="sub" id="loginSub">Pick your name to start logging.</p>
    <div id="whoGrid" class="who-grid"></div>
    <div id="pinBox" class="pinbox" style="display:none">
      <div class="pindots"><i></i><i></i><i></i><i></i></div>
      <div class="pad" id="pad"></div>
    </div>
  </div>

  <!-- APP -->
  <div id="app" style="display:none">
    <div class="top">
      <h1 id="screenTitle">Today</h1>
      <div class="who" id="whoAmI"></div>
    </div>

    <section class="screen on" id="s-home"></section>
    <section class="screen" id="s-team"></section>
    <section class="screen" id="s-funnel"></section>
    <section class="screen" id="s-history"></section>
    <section class="screen" id="s-admin"></section>

    <nav class="tabs" id="tabs"></nav>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ============================================================
   CONFIG — paste your two Supabase values here, nothing else.
   Project settings → API Keys → Project URL and publishable key.
   ============================================================ */
const SUPABASE_URL  = "https://foebtbsfytlmvsdcmyor.supabase.co";
const SUPABASE_ANON = "sb_publishable_XRR4kWS7q2pr5opRNhkmJA_qoaa7HSw";

/* ---------------------------------------------------------- */

// Goal categories — the four you set targets against.
const CATS = [
  { k:'preaching',  label:'Simple preaching', short:'Preached', cls:'preach', goal:'goal_preaching',  count:'preaching_count'  },
  { k:'valid',      label:'Valid',            short:'Valid',    cls:'valid',  goal:'goal_valid',      count:'valid_count'      },
  { k:'baptism',    label:'Baptism',          short:'Fruit',    cls:'fruit',  goal:'goal_baptism',    count:'baptism_count'    },
  { k:'attendance', label:'Attendance',       short:'Retained', cls:'ret',    goal:'goal_attendance', count:'attendance_count' },
];

// Everything that earns points, for the admin screen and history labels.
const SCORE = {
  preaching:       { label:'Simple preaching',  cls:'preach', group:'Simple'         },
  valid:           { label:'Valid',             cls:'valid',  group:'People'         },
  baptism:         { label:'Baptism',           cls:'fruit',  group:'People'         },
  attendance_new:  { label:'Attendance',        cls:'ret',    group:'People'         },
  attendance_lost: { label:'Lost sheep',        cls:'ret',    group:'People'         },
  pa:              { label:'Preaching Academy', cls:'preach', group:'Education'      },
  ea:              { label:'Elohim Academy',    cls:'preach', group:'Education'      },
  lms:             { label:'LMS',               cls:'preach', group:'Education'      },
  online_mission:  { label:'Online Mission',    cls:'preach', group:'Online Mission' },
};
const TOOLS = [
  { k:'pa',             label:'Preaching<br>Academy' },
  { k:'ea',             label:'Elohim<br>Academy'    },
  { k:'lms',            label:'LMS'                  },
  { k:'online_mission', label:'Online<br>Mission'    },
];
const DEFS = {
  preaching      : 'A single gospel conversation with one person, however brief.',
  valid          : 'A person who accepted and began a Bible study.',
  baptism        : 'A baptism resulting from your work.',
  attendance_new : 'A fruit who kept a service after their baptism.',
  attendance_lost: 'A lost sheep returning to service. Their baptism happened elsewhere.',
  pa             : 'Preaching Academy.',
  ea             : 'Elohim Academy.',
  lms            : 'Learning Management System.',
  online_mission : 'Online Mission.',
};
const HEX = { preach:'#4A6FA5', valid:'#0E8A7D', fruit:'#C4790F', ret:'#B22E4C' };

let sb = null, me = null, pin = null;
let roster = [], stats = [], funnel = [], goals = [], pointVals = [], caps = [];
let month = monthKey(new Date());
let tab = 'home', teamSort = 'points', pending = [];

const $  = s => document.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const num = n => Number(n || 0).toLocaleString();

function monthKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`; }
function monthName(k){ const [y,m] = k.split('-').map(Number); return new Date(y, m-1, 1).toLocaleDateString(undefined, { month:'long', year:'numeric' }); }
function today(){ const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

function toast(msg, bad){
  const t = $('#toast');
  t.textContent = msg; t.className = 'toast on' + (bad ? ' bad' : '');
  clearTimeout(t._t); t._t = setTimeout(() => t.className = 'toast', 2600);
}

/* ---------- data ---------- */

async function rpc(fn, args){
  const { data, error } = await sb.rpc(fn, args);
  if (error) throw new Error(cleanErr(error.message));
  return data;
}
const cleanErr = m => !m ? 'Something went wrong. Try again.'
  : m.replace(/^.*?:\s*/, '').replace(/\s*\(SQLSTATE.*\)$/, '');

async function loadAll(){
  const [r, g, p, c] = await Promise.all([
    sb.from('v_members_public').select('*').eq('is_active', true).order('name'),
    sb.from('goals').select('*'),
    sb.from('point_values').select('*'),
    sb.from('category_caps').select('*'),
  ]);
  roster = r.data || []; goals = g.data || []; pointVals = p.data || []; caps = c.data || [];
  await loadStats();
}
async function loadStats(){
  const [s, f] = await Promise.all([
    sb.from('v_monthly_stats').select('*').eq('month', month),
    sb.from('v_funnel').select('*'),
  ]);
  stats = s.data || []; funnel = f.data || [];
}

const latest = rows => rows.sort((a,b) => a.effective_from < b.effective_from ? 1 : -1)[0];
function pointFor(cat){ const r = latest(pointVals.filter(p => p.category === cat)); return r ? r.points : 0; }
function capFor(key){ const r = latest(caps.filter(c => c.cap_key === key)); return r ? r.cap_points : 0; }
function targetFor(group, cat){
  const r = latest(goals.filter(g => g.group_name === group && g.category === cat));
  return r ? r.target : 0;
}
// Denominator for the progress ring: goal targets at their point value,
// with the simple ceiling applied the same way the database applies it.
function maxPoints(group){
  const simple = Math.min(targetFor(group,'preaching') * pointFor('preaching'), capFor('simple'));
  return simple
    + targetFor(group,'valid')      * pointFor('valid')
    + targetFor(group,'baptism')    * pointFor('baptism')
    + targetFor(group,'attendance') * pointFor('attendance_new');
}
function statsFor(id){
  const row = stats.find(s => s.member_id === id);
  if (row) return row;
  const m = roster.find(r => r.id === id) || { group_name:'member' };
  const b = { member_id:id, points:0, group_name:m.group_name, simple_raw:0, education_raw:0,
              simple_points:0, education_points:0, online_points:0, contact_points:0,
              cap_simple:capFor('simple'), cap_education:capFor('education'),
              pa_count:0, ea_count:0, lms_count:0, online_count:0,
              attendance_new_count:0, attendance_lost_count:0 };
  CATS.forEach(c => { b[c.count] = 0; b[c.goal] = targetFor(m.group_name, c.k); });
  return b;
}

/* ---------- offline queue ---------- */

function loadPending(){ try { pending = JSON.parse(localStorage.getItem('pending') || '[]'); } catch { pending = []; } }
function savePending(){ localStorage.setItem('pending', JSON.stringify(pending)); $('#offline').className = 'offline' + (pending.length ? ' on' : ''); }
function queue(fn, args){ pending.push({ fn, args }); savePending(); }
async function flush(){
  if (!pending.length || !navigator.onLine) return;
  const batch = [...pending]; pending = []; savePending();
  for (const job of batch){
    try { await rpc(job.fn, { ...job.args, p_member_id: me.id, p_pin: pin }); } catch { pending.push(job); }
  }
  savePending();
  if (!pending.length){ await loadStats(); render(); toast('Synced'); }
}
window.addEventListener('online', flush);

/* ---------- login ---------- */

async function boot(){
  if (SUPABASE_URL.startsWith('YOUR_')){
    $('#login').innerHTML = '<div class="setup"><h1 style="font-size:22px;margin-bottom:14px">Nearly there</h1>' +
      'Open <code>index.html</code>, find the CONFIG block at the top of the script, and paste in your Supabase project URL and publishable key. Then reload.</div>';
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  loadPending();
  try {
    const { data, error } = await sb.from('v_members_public').select('*').eq('is_active', true).order('name');
    if (error) throw error;
    roster = data || [];
  } catch {
    $('#loginSub').textContent = "Can't reach the database. Check your connection and reload.";
    return;
  }
  if (!roster.length){
    $('#loginSub').textContent = 'No one has been added yet. Run the schema file first, then sign in as the admin it creates.';
    return;
  }
  const grid = $('#whoGrid');
  roster.forEach(m => {
    const b = el('button','', `<span class="n">${esc(m.name)}</span><span class="g">${m.group_name === 'evangelist' ? 'Evangelist' : 'Member'}</span>`);
    b.onclick = () => askPin(m);
    grid.appendChild(b);
  });
}

function askPin(m){
  $('#whoGrid').style.display = 'none';
  $('#pinBox').style.display = 'block';
  $('#login').querySelector('h1').textContent = m.name;
  $('#loginSub').textContent = 'Enter your 4-digit PIN.';
  let buf = '';
  const dots = $('#pinBox').querySelectorAll('.pindots i');
  const paint = () => dots.forEach((d,i) => d.className = i < buf.length ? 'f' : '');
  const pad = $('#pad'); pad.innerHTML = '';
  ['1','2','3','4','5','6','7','8','9','back','0','go'].forEach(k => {
    const b = el('button', (k === 'back' || k === 'go') ? 'alt' : '', k === 'back' ? 'Delete' : k === 'go' ? 'Back' : k);
    b.onclick = async () => {
      if (k === 'go') return location.reload();
      if (k === 'back'){ buf = buf.slice(0,-1); return paint(); }
      if (buf.length >= 4) return;
      buf += k; paint();
      if (buf.length === 4){
        try {
          me = await rpc('login', { p_member_id: m.id, p_pin: buf }); pin = buf;
          $('#login').style.display = 'none'; $('#app').style.display = 'block';
          await start();
        } catch (e){ toast(e.message, true); buf = ''; paint(); }
      }
    };
    pad.appendChild(b);
  });
  paint();
}

async function start(){
  $('#whoAmI').innerHTML = `<b>${esc(me.name)}</b> · ${me.group_name === 'evangelist' ? 'Evangelist' : 'Member'}`;
  buildTabs();
  await loadAll();
  render(); flush();
  sb.channel('live')
    .on('postgres_changes', { event:'*', schema:'public', table:'activity_entries' }, refresh)
    .on('postgres_changes', { event:'*', schema:'public', table:'contact_events' }, refresh)
    .subscribe();
  setInterval(() => { const k = monthKey(new Date()); if (k !== month && tab !== 'history'){ month = k; refresh(); } }, 60000);
}
let refreshTimer;
function refresh(){ clearTimeout(refreshTimer); refreshTimer = setTimeout(async () => { await loadStats(); render(); }, 350); }

/* ---------- tabs ---------- */

  funnel: '<path d="M3.5 5h17l-6.5 7.5V20l-4-2.2v-5.3z"/>',

};
const TABS = [['home','Today'],['team','Team'],['funnel','Funnel'],['history','History']];

function buildTabs(){
  const nav = $('#tabs'); nav.innerHTML = '';
  (me.is_admin ? [...TABS, ['admin','Admin']] : TABS).forEach(([k,label]) => {
    const b = el('button', k === tab ? 'on' : '', `<svg viewBox="0 0 24 24">${ICONS[k]}</svg>${label}`);
    b.onclick = () => {
      tab = k;
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
      $('#s-' + k).classList.add('on');
      buildTabs(); $('#screenTitle').textContent = label; window.scrollTo(0,0); render();
    };

/* ---------- render ---------- */

function render(){
  ({ home:renderHome, team:renderTeam, funnel:renderFunnel, history:renderHistory, admin:renderAdmin }[tab] || (()=>{}))();
}

function renderHome(){
  const s = statsFor(me.id);
  const max = maxPoints(me.group_name) || 1;
  const pct = Math.min(100, Math.round(s.points / max * 100));
  const box = $('#s-home'); box.innerHTML = '';

  box.appendChild(el('div','rail',
    `<div class="s-preach"><span class="n">${num(s.preaching_count)}</span><span class="l">Preached</span></div>
     <div class="s-valid"><span class="n">${num(s.valid_count)}</span><span class="l">Valid</span></div>
     <div class="s-fruit"><span class="n">${num(s.baptism_count)}</span><span class="l">Fruit</span></div>
     <div class="s-ret"><span class="n">${num(s.attendance_count)}</span><span class="l">Attended</span></div>`));
  const lost = s.attendance_lost_count || 0;
  box.appendChild(el('p','rail-cap', monthName(month) + (lost ? ` · ${lost} of those ${lost === 1 ? 'is a lost sheep' : 'are lost sheep'}` : '')));

  box.appendChild(el('div','pts',
    `<div><div class="big">${num(s.points)}</div><div class="lab">points this month</div></div>
     <div class="pct">${pct}% of ${num(max)}</div>`));

  CATS.forEach(c => {
    const have = s[c.count] || 0, want = s[c.goal] ?? targetFor(me.group_name, c.k);
    if (!want){
      box.appendChild(el('div','goal',
        `<div class="r1"><span class="nm">${c.label}</span><span class="ct"><b>${num(have)}</b> · no target</span></div>
         <div class="bar"><i style="width:${have ? 100 : 0}%;background:${HEX[c.cls]}"></i></div>`));
      return;
    }
    box.appendChild(el('div', 'goal' + (have >= want ? ' done' : ''),
      `<div class="r1"><span class="nm">${c.label}</span><span class="ct"><b>${num(have)}</b> / ${num(want)}</span></div>
       <div class="bar"><i style="width:${Math.min(100, have/want*100)}%;background:${HEX[c.cls]}"></i></div>`));
  });

  // where the points came from, and what is being clipped by a ceiling
  box.appendChild(el('p','qtitle','Where your points came from'));
  const bk = el('div','card');
  bk.appendChild(el('div','bk',
    `<div class="r1"><span class="nm">People</span><span class="ct"><b>${num(s.contact_points)}</b> pts</span></div>`));
  [['Simple preaching', s.simple_raw, s.simple_points, s.cap_simple],
   ['Education',        s.education_raw, s.education_points, s.cap_education]].forEach(([label, raw, got, cap]) => {
    const hit = raw > cap;
    bk.appendChild(el('div','bk',
      `<div class="r1"><span class="nm">${label}</span>
        <span class="ct ${hit ? 'capped' : ''}"><b>${num(got)}</b> / ${num(cap)} max${hit ? ` · ${num(raw - cap)} over` : ''}</span></div>
       <div class="bar"><i style="width:${Math.min(100, got/(cap||1)*100)}%;background:${hit ? HEX.fruit : HEX.preach}"></i></div>`));
  });
  bk.appendChild(el('div','bk',
    `<div class="r1"><span class="nm">Online Mission</span><span class="ct"><b>${num(s.online_points)}</b> pts</span></div>`));
  box.appendChild(bk);

  box.appendChild(el('p','qtitle','Log something'));
  const bp = el('button','q-preach','<span>Simple preaching</span><b>+1</b>');
  bp.onclick = () => quickActivity('preaching', bp);
  box.appendChild(bp);

  box.appendChild(el('p','q-sub','People'));
  const row = el('div','q-row');
  [['valid','Valid','b-valid'],['baptism','Baptism','b-fruit'],['attendance','Attendance','b-ret']].forEach(([k,label,cls]) => {
    const b = el('button', cls, label);
    b.onclick = () => k === 'attendance' ? openAttendanceSheet() : openContactSheet(k);
    row.appendChild(b);
  });
  box.appendChild(row);

  box.appendChild(el('p','q-sub','Tools'));
  const tools = el('div','q-tools');
  TOOLS.forEach(t => {
    const b = el('button','', `${t.label}<b>+1</b>`);
    b.onclick = () => quickActivity(t.k, b);
    tools.appendChild(b);
  });
  box.appendChild(tools);

  const bd = el('button','backdate','Log for another day');
  bd.onclick = openBackdate;
  box.appendChild(bd);
}

async function quickActivity(cat, btn){
  const row = stats.find(x => x.member_id === me.id);
  if (row){
    const pts = pointFor(cat);
    if (cat === 'preaching'){
      row.preaching_count++; row.simple_raw += pts;
      row.simple_points = Math.min(row.simple_raw, row.cap_simple);
    } else if (cat === 'online_mission'){
      row.online_count++; row.online_points += pts;
    } else {
      row[cat + '_count']++; row.education_raw += pts;
      row.education_points = Math.min(row.education_raw, row.cap_education);
    }
    row.points = row.simple_points + row.education_points + row.online_points + row.contact_points;
  }
  renderHome(); btn.blur();
  const args = { p_category: cat, p_count: 1, p_date: today() };
  if (!navigator.onLine){ queue('log_activity', args); return toast('Saved. Will sync later.'); }
  try { await rpc('log_activity', { p_member_id:me.id, p_pin:pin, ...args }); await loadStats(); renderHome(); }
  catch (e){ queue('log_activity', args); toast(e.message + ' — queued', true); }
}

function renderTeam(){
  const box = $('#s-team'); box.innerHTML = '';
  const seg = el('div','seg');
  [['points','Points'],['preaching_count','Preached'],['valid_count','Valid'],['baptism_count','Fruit'],['attendance_count','Attended']]
    .forEach(([k,label]) => {
      const b = el('button', teamSort === k ? 'on' : '', label);
      b.onclick = () => { teamSort = k; renderTeam(); };
      seg.appendChild(b);
    });
  box.appendChild(seg);
  box.appendChild(el('p','rail-cap', monthName(month)));

  [['evangelist','Evangelists'],['member','Members']].forEach(([g,label]) => {
    const people = roster.filter(m => m.group_name === g).map(m => ({ ...m, s: statsFor(m.id) }))
      .sort((a,b) => (b.s[teamSort] || 0) - (a.s[teamSort] || 0));
    if (!people.length) return;
    const total = people.reduce((t,p) => t + (p.s.points || 0), 0);
    const pm = maxPoints(g) || 1;
    box.appendChild(el('div','ghead', `<h2>${label}</h2><div class="tot">${num(total)}<small>of ${num(pm*people.length)} pts</small></div>`));
    const card = el('div','card');
    people.forEach((p,i) => {
      const pct = Math.min(100, Math.round((p.s.points || 0) / pm * 100));
      const detail = teamSort === 'points'
        ? CATS.map(c => `${p.s[c.count] || 0} ${c.short.toLowerCase()}`).join(' · ')
        : `${num(p.s.points)} points`;
      card.appendChild(el('div','row',
        `<div class="rank">${i+1}</div>
         <div class="grow"><div class="nm">${esc(p.name)}${p.id === me.id ? ' · you' : ''}</div>
           <div class="sub">${detail}</div><div class="mini"><i style="width:${pct}%"></i></div></div>
         <div class="val">${num(p.s[teamSort])}<small>${pct}%</small></div>`));
    });
    box.appendChild(card);
  });
  box.appendChild(el('p','rail-cap','Groups have different targets, so the two lists are ranked separately.'));
}

function renderFunnel(){
  const box = $('#s-funnel'); box.innerHTML = '';
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 35);
  const quiet = f => f.last_attended && new Date(f.last_attended) < cutoff;

  [['evangelist','Evangelists'],['member','Members']].forEach(([g,label]) => {
    const rows = funnel.filter(f => f.group_name === g);
    if (!rows.length) return;
    const fruit = rows.filter(r => r.kind === 'fruit');
    const sheep = rows.filter(r => r.kind === 'lost_sheep');
    const b = fruit.filter(r => r.stage !== 'valid').length;
    const r = fruit.filter(r => r.stage === 'retained').length;
    box.appendChild(el('div','ghead', `<h2>${label}</h2><div class="tot">${rows.length}<small>being followed</small></div>`));
    box.appendChild(el('div','rail',
      `<div class="s-valid"><span class="n">${fruit.length}</span><span class="l">Valid</span></div>
       <div class="s-fruit"><span class="n">${b}</span><span class="l">Baptized</span></div>
       <div class="s-ret"><span class="n">${r}</span><span class="l">Retained</span></div>
       <div class="s-preach"><span class="n">${sheep.length}</span><span class="l">Lost sheep</span></div>`));
    box.appendChild(el('p','rail-cap', fruit.length
      ? `${Math.round(b/fruit.length*100)}% of valids reached baptism · ${b ? Math.round(r/b*100) : 0}% of fruit still attending` : ''));
  });

  if (!funnel.filter(f => f.member_id === me.id).length){
    box.appendChild(el('div','empty','<b>Nobody here yet</b><span>Log a valid on the Today screen and the person appears here as they move through the stages.</span>'));
    return;
  }
  box.appendChild(el('div','ghead','<h2>Your people</h2>'));
  const card = el('div','card'); card.id = 'myFunnel'; box.appendChild(card);
  fillMyFunnel(quiet);
}

async function fillMyFunnel(quiet){
  const card = $('#myFunnel'); if (!card) return;
  card.innerHTML = '<div class="row"><div class="grow"><div class="sub">Loading names…</div></div></div>';
  let list = [];
  try { list = await rpc('my_contacts', { p_member_id: me.id, p_pin: pin }); }
  catch (e){ return void (card.innerHTML = `<div class="row"><div class="grow"><div class="sub">${esc(e.message)}</div></div></div>`); }
  card.innerHTML = '';
  list.forEach(c => {
    const isQuiet = c.last_attended && quiet(c);
    const pill = isQuiet                  ? ['p-quiet','Gone quiet']
               : c.stage === 'lost_sheep' ? ['p-preach','Lost sheep']
               : c.stage === 'retained'   ? ['p-ret','Retained']
               : c.stage === 'baptized'   ? ['p-fruit','Baptized'] : ['p-valid','Valid'];
    const sub = c.last_attended
      ? `Last attended ${new Date(c.last_attended + 'T00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})}`
      : 'No attendance yet';
    card.appendChild(el('div','row',
      `<div class="grow"><div class="nm">${esc(c.name)}</div><div class="sub">${sub}</div></div>
       <span class="pill ${pill[0]}">${pill[1]}</span>`));
  });
  card.appendChild(el('p','rail-cap','Only you and the admin can see these names.'));
}

async function renderHistory(){
  const box = $('#s-history'); box.innerHTML = '';
  const sel = el('select','inp');
  for (let i = 0; i < 12; i++){
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
    const k = monthKey(d); const o = el('option','', monthName(k)); o.value = k; sel.appendChild(o);
  }
  sel.value = month;
  sel.onchange = async () => { month = sel.value; await loadStats(); render(); };
  box.appendChild(sel);
  const list = el('div','card','<div class="row"><div class="grow"><div class="sub">Loading…</div></div></div>');
  box.appendChild(list);

  let rows = [];
  try { rows = await rpc('my_history', { p_member_id: me.id, p_pin: pin, p_month: month }); }
  catch (e){ return void (list.innerHTML = `<div class="row"><div class="grow"><div class="sub">${esc(e.message)}</div></div></div>`); }

  if (!rows.length){
    box.removeChild(list);
    box.appendChild(el('div','empty','<b>Nothing logged this month</b><span>Anything you log on the Today screen shows up here, where you can correct or remove it.</span>'));
    return;
  }
  list.innerHTML = '';
  rows.forEach(r => {
    const sc = SCORE[r.category] || { label:r.category, cls:'preach' };
    const d = new Date(r.on_date + 'T00:00').toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
    const label = r.kind === 'activity'
      ? `${r.count} × ${sc.label}`
      : `${sc.label}${r.who ? ' · ' + esc(r.who) : ''}`;
    const pts = r.kind === 'activity' ? r.count * pointFor(r.category) : pointFor(r.category);
    const row = el('div','row',
      `<div class="grow"><div class="nm">${label}</div><div class="sub">${d}${r.note ? ' · ' + esc(r.note) : ''}</div></div>
       <span class="pill p-${sc.cls}">+${num(pts)}</span>`);
    row.style.cursor = 'pointer';
    row.onclick = () => confirmDelete(r, label);
    list.appendChild(row);
  });
  box.appendChild(el('p','rail-cap','Tap an entry to remove it. Ceilings mean some of these may not all have counted.'));
}

function confirmDelete(r, label){
  openSheet(`<h2>Remove this entry?</h2><p class="hint">${label} on ${r.on_date}.</p>`,
    [{ label:'Remove entry', cls:'btn danger', run: async () => {
        await rpc('delete_entry', { p_member_id:me.id, p_pin:pin, p_id:r.id, p_kind:r.kind });
        await loadStats(); closeSheet(); render(); toast('Removed');
      }},
     { label:'Keep it', cls:'btn ghost', run: closeSheet }]);
}

/* ---------- sheets ---------- */

function openSheet(html, actions){
  const s = $('#sheet');
  s.innerHTML = '<div class="grab"></div>' + html;
  (actions || []).forEach(a => {
    const b = el('button', a.cls || 'btn', a.label);
    b.onclick = async () => { b.disabled = true; try { await a.run(); } catch (e){ toast(e.message, true); b.disabled = false; } };
    s.appendChild(b);
  });
  $('#scrim').className = 'scrim on';
  requestAnimationFrame(() => s.className = 'sheet on');
}
function closeSheet(){ $('#sheet').className = 'sheet'; $('#scrim').className = 'scrim'; }
$('#scrim').onclick = closeSheet;

function picker(wrap, people, onPick){
  people.forEach(c => {
    const pill = c.kind === 'lost_sheep' ? ['p-preach','Lost sheep']
               : c.stage === 'retained'  ? ['p-ret','Retained']
               : c.stage === 'baptized'  ? ['p-fruit','Baptized'] : ['p-valid','Valid'];
    const b = el('button','pick', `<span class="nm">${esc(c.name)}</span><span class="pill ${pill[0]}">${pill[1]}</span>`);
    b.onclick = () => { onPick(c.id); wrap.querySelectorAll('.pick').forEach(x => x.className = 'pick'); b.className = 'pick sel'; };
    wrap.appendChild(b);
  });
}

async function openContactSheet(kind){
  let list = [];
  try { list = await rpc('my_contacts', { p_member_id: me.id, p_pin: pin }); }
  catch (e){ return toast(e.message, true); }
  const eligible = kind === 'baptism' ? list.filter(c => c.kind === 'fruit' && c.stage === 'valid') : [];
  let chosen = null;
  const label = SCORE[kind].label;

  const body = `<h2>${label}</h2><p class="hint">${DEFS[kind]}</p>` +
    (kind === 'valid'
      ? `<label class="f">Their name</label><input class="inp" id="newName" placeholder="First name and last initial" autocomplete="off">`
      : eligible.length
        ? `<label class="f">Who is this?</label><div id="picks"></div>`
        : `<p class="hint">Nobody is waiting at the valid stage. Log a valid first, then come back.</p>`) +
    (kind === 'valid' || eligible.length ? `<label class="f">Note (optional)</label><input class="inp" id="note" autocomplete="off">` : '');

  openSheet(body, (kind === 'valid' || eligible.length) ? [{
    label:`Log ${label.toLowerCase()}`, cls:'btn',
    run: async () => {
      const name = $('#newName') ? $('#newName').value.trim() : null;
      if (kind === 'valid' && !name) return toast('Give the person a name', true);
      if (kind !== 'valid' && !chosen) return toast('Pick who this is', true);
      await rpc('log_contact_event', { p_member_id:me.id, p_pin:pin, p_event_type:kind,
        p_contact_id:chosen, p_new_name:name, p_date:today(), p_note: $('#note') ? $('#note').value : null });
      await loadStats(); closeSheet(); render(); toast(`${label} logged`);
    }
  }] : [{ label:'Close', cls:'btn ghost', run: closeSheet }]);

  if (eligible.length) picker($('#picks'), eligible, id => chosen = id);
}

// One sheet covers both kinds of attendance. A baptized fruit
// scores the new-attendance value, a lost sheep the lower one.
async function openAttendanceSheet(){
  let list = [];
  try { list = await rpc('my_contacts', { p_member_id: me.id, p_pin: pin }); }
  catch (e){ return toast(e.message, true); }
  const eligible = list.filter(c => c.kind === 'lost_sheep' || c.stage === 'baptized' || c.stage === 'retained');
  let chosen = null, chosenKind = null, addingSheep = false;

  openSheet(
    `<h2>Attendance</h2>
     <p class="hint">A fruit who kept a service is worth ${num(pointFor('attendance_new'))}. A lost sheep returning is worth ${num(pointFor('attendance_lost'))}.</p>
     ${eligible.length ? '<label class="f">Who attended?</label><div id="picks"></div>' : ''}
     <div id="sheepBox"></div>
     <label class="f">Note (optional)</label><input class="inp" id="note" autocomplete="off">`,
    [{ label:'Log attendance', cls:'btn', run: async () => {
        if (addingSheep){
          const nm = $('#sheepName').value.trim();
          if (!nm) return toast('Give the lost sheep a name', true);
          await rpc('log_contact_event', { p_member_id:me.id, p_pin:pin, p_event_type:'attendance_lost',
            p_new_name:nm, p_date:today(), p_note:$('#note').value });
        } else {
          if (!chosen) return toast('Pick who attended', true);
          await rpc('log_contact_event', { p_member_id:me.id, p_pin:pin,
            p_event_type: chosenKind === 'lost_sheep' ? 'attendance_lost' : 'attendance_new',
            p_contact_id:chosen, p_date:today(), p_note:$('#note').value });
        }
        await loadStats(); closeSheet(); render(); toast('Attendance logged');
      }},
     { label:'Cancel', cls:'btn ghost', run: closeSheet }]);

  if (eligible.length) picker($('#picks'), eligible, id => {
    chosen = id; addingSheep = false;
    chosenKind = eligible.find(c => c.id === id).kind;
    $('#sheepBox').innerHTML = '';
    renderSheepToggle();
  });
  renderSheepToggle();

  function renderSheepToggle(){
    const box = $('#sheepBox'); if (!box) return;
    if (addingSheep){
      box.innerHTML = `<label class="f">Lost sheep's name</label><input class="inp" id="sheepName" placeholder="First name and last initial" autocomplete="off">`;
      return;
    }
    box.innerHTML = '';
    const b = el('button','pick','<span class="nm">Someone returning who isn\'t on this list</span>');
    b.onclick = () => { addingSheep = true; chosen = null;
      if ($('#picks')) $('#picks').querySelectorAll('.pick').forEach(x => x.className = 'pick');
      renderSheepToggle(); $('#sheepName').focus(); };
    box.appendChild(b);
  }
}

function openBackdate(){
  const opts = Object.entries(SCORE)
    .filter(([k]) => ['preaching','pa','ea','lms','online_mission'].includes(k))
    .map(([k,v]) => `<option value="${k}">${v.label}</option>`).join('');
  openSheet(`<h2>Log for another day</h2>
    <p class="hint">For anything you forgot to tap at the time. People go through the buttons above instead, so the stage rules still apply.</p>
    <label class="f">What</label><select class="inp" id="bdCat">${opts}</select>
    <label class="f">How many</label><input class="inp" id="bdCount" type="number" inputmode="numeric" min="1" value="1">
    <label class="f">Date</label><input class="inp" id="bdDate" type="date" max="${today()}" value="${today()}">
    <label class="f">Note (optional)</label><input class="inp" id="bdNote" autocomplete="off">`,
    [{ label:'Save', cls:'btn', run: async () => {
        const c = parseInt($('#bdCount').value, 10);
        if (!c || c < 1) return toast('Enter at least 1', true);
        await rpc('log_activity', { p_member_id:me.id, p_pin:pin, p_category:$('#bdCat').value,
          p_count:c, p_date:$('#bdDate').value, p_note:$('#bdNote').value });
        await loadStats(); closeSheet(); render(); toast('Saved');
      }},
     { label:'Cancel', cls:'btn ghost', run: closeSheet }]);
}

/* ---------- admin ---------- */

function renderAdmin(){
  const box = $('#s-admin'); box.innerHTML = '';

  box.appendChild(el('div','ghead','<h2>Team</h2>'));
  const card = el('div','card');
  roster.forEach(m => {
    const r = el('div','row',
      `<div class="grow"><div class="nm">${esc(m.name)}${m.is_admin ? ' · admin' : ''}</div>
        <div class="sub">${m.group_name === 'evangelist' ? 'Evangelist' : 'Member'}</div></div>
       <span class="pill p-preach">Edit</span>`);
    r.style.cursor = 'pointer'; r.onclick = () => memberSheet(m); card.appendChild(r);
  });
  box.appendChild(card);
  const add = el('button','btn','Add someone'); add.onclick = () => memberSheet(null); box.appendChild(add);

  box.appendChild(el('div','ghead','<h2>Goal targets</h2>'));
  const g = el('div','card');
  CATS.forEach(c => {
    const r = el('div','row',
      `<div class="grow"><div class="nm">${c.label}</div>
        <div class="sub">Evangelist ${targetFor('evangelist',c.k)} · Member ${targetFor('member',c.k)}</div></div>
       <span class="pill p-${c.cls}">Edit</span>`);
    r.style.cursor = 'pointer'; r.onclick = () => goalSheet(c); g.appendChild(r);
  });
  box.appendChild(g);

  box.appendChild(el('div','ghead','<h2>Point values</h2>'));
  const p = el('div','card');
  Object.entries(SCORE).forEach(([k,v]) => {
    const r = el('div','row',
      `<div class="grow"><div class="nm">${v.label}</div><div class="sub">${v.group}</div></div>
       <div class="val">${num(pointFor(k))}<small>points</small></div>`);
    r.style.cursor = 'pointer'; r.onclick = () => pointSheet(k, v); p.appendChild(r);
  });
  box.appendChild(p);

  box.appendChild(el('div','ghead','<h2>Monthly ceilings</h2>'));
  const c = el('div','card');
  [['simple','Simple preaching','Points from simple preaching stop counting past this.'],
   ['education','Education','Preaching Academy, Elohim Academy and LMS share this ceiling.']].forEach(([k,label,sub]) => {
    const r = el('div','row',
      `<div class="grow"><div class="nm">${label}</div><div class="sub">${sub}</div></div>
       <div class="val">${num(capFor(k))}<small>max</small></div>`);
    r.style.cursor = 'pointer'; r.onclick = () => capSheet(k, label); c.appendChild(r);
  });
  box.appendChild(c);
  box.appendChild(el('p','rail-cap','Changes take effect from the 1st of this month. Past months keep the numbers they were scored with.'));

  const ex = el('button','btn ghost','Export everything as CSV'); ex.onclick = doExport; box.appendChild(ex);
}

function memberSheet(m){
  openSheet(`<h2>${m ? esc(m.name) : 'Add someone'}</h2>
    <label class="f">Name</label><input class="inp" id="mName" value="${m ? esc(m.name) : ''}" autocomplete="off">
    <label class="f">Group</label>
    <select class="inp" id="mGroup">
      <option value="evangelist"${m && m.group_name === 'evangelist' ? ' selected' : ''}>Evangelist</option>
      <option value="member"${!m || m.group_name === 'member' ? ' selected' : ''}>Member</option>
    </select>
    <label class="f">${m ? 'New PIN (leave blank to keep theirs)' : '4-digit PIN'}</label>
    <input class="inp" id="mPin" inputmode="numeric" maxlength="4" placeholder="${m ? '••••' : '0000'}" autocomplete="off">
    <label class="f"><input type="checkbox" id="mAdmin"${m && m.is_admin ? ' checked' : ''}> Give admin access</label>`,
    [{ label: m ? 'Save changes' : 'Add to team', cls:'btn', run: async () => {
        const name = $('#mName').value.trim();
        if (!name) return toast('Name is required', true);
        await rpc('admin_save_member', { p_member_id:me.id, p_pin:pin, p_name:name, p_group:$('#mGroup').value,
          p_new_pin:$('#mPin').value || null, p_is_admin:$('#mAdmin').checked, p_target_id: m ? m.id : null });
        await loadAll(); closeSheet(); render(); toast(m ? 'Saved' : 'Added');
      }},
     ...(m && m.id !== me.id ? [{ label:'Remove from team', cls:'btn danger', run: async () => {
        await rpc('admin_set_active', { p_member_id:me.id, p_pin:pin, p_target_id:m.id, p_active:false });
        await loadAll(); closeSheet(); render(); toast('Removed. Their history is kept.');
      }}] : []),
     { label:'Cancel', cls:'btn ghost', run: closeSheet }]);
}

function goalSheet(c){
  openSheet(`<h2>${c.label}</h2><p class="hint">${DEFS[c.k] || DEFS[c.k + '_new'] || ''}</p>
    <label class="f">Evangelist target</label><input class="inp" id="gE" type="number" min="0" value="${targetFor('evangelist',c.k)}">
    <label class="f">Member target</label><input class="inp" id="gM" type="number" min="0" value="${targetFor('member',c.k)}">`,
    [{ label:'Save', cls:'btn', run: async () => {
        await rpc('admin_set_goal', { p_member_id:me.id, p_pin:pin, p_group:'evangelist', p_category:c.k, p_target:+$('#gE').value });
        await rpc('admin_set_goal', { p_member_id:me.id, p_pin:pin, p_group:'member',     p_category:c.k, p_target:+$('#gM').value });
        await loadAll(); closeSheet(); render(); toast('Updated');
      }},
     { label:'Cancel', cls:'btn ghost', run: closeSheet }]);
}

function pointSheet(k, v){
  openSheet(`<h2>${v.label}</h2><p class="hint">${DEFS[k] || ''}</p>
    <label class="f">Points each</label><input class="inp" id="pv" type="number" min="0" value="${pointFor(k)}">`,
    [{ label:'Save', cls:'btn', run: async () => {
        await rpc('admin_set_points', { p_member_id:me.id, p_pin:pin, p_category:k, p_points:+$('#pv').value });
        await loadAll(); closeSheet(); render(); toast('Updated');
      }},
     { label:'Cancel', cls:'btn ghost', run: closeSheet }]);
}

function capSheet(k, label){
  openSheet(`<h2>${label} ceiling</h2>
    <p class="hint">Points above this stop counting for the month. Set it to 0 to remove the ceiling entirely.</p>
    <label class="f">Maximum points per month</label><input class="inp" id="cv" type="number" min="0" value="${capFor(k)}">`,
    [{ label:'Save', cls:'btn', run: async () => {
        await rpc('admin_set_cap', { p_member_id:me.id, p_pin:pin, p_key:k, p_cap:+$('#cv').value });
        await loadAll(); closeSheet(); render(); toast('Updated');
      }},
     { label:'Cancel', cls:'btn ghost', run: closeSheet }]);
}

async function doExport(){
  try {
    const rows = await rpc('admin_export', { p_member_id:me.id, p_pin:pin });
    const csv = [['member','group','date','category','count','contact','note'].join(',')]
      .concat(rows.map(r => [r.member, r.group_name, r.on_date,
        (SCORE[r.category] || {}).label || r.category, r.count, r.who || '', r.note || '']
        .map(v => `"${String(v).replace(/"/g,'""')}"`).join(','))).join('\n');
    const a = el('a'); a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv' }));
    a.download = `harvest-${today()}.csv`; a.click();
    toast(`Exported ${rows.length} rows`);
  } catch (e){ toast(e.message, true); }
}

boot();
</script>
</body>
</html>
